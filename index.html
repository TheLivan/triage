<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Triage Report</title>
  <style>
    /* palette from the pvs-studio.com design system (ds.css) */
    :root { color-scheme: light; --bg: #f0f1f2; --fg: #141414; --panel: #fff; --border: #d4e0ed; --muted: #414f57; --control: #d4e0ed; --hover: #d4f0fe; --accent: #0069e0; --accent-hover: #004ec2; --danger: #b3261e; --row-border: #f0f1f2; --th: #f7f9fb; --row-hover: #f2fafe; --link: #004ec2; --subtle: #f7f9fb; --target: #d4f0fe; --bug-bg: #fde8e7; --bug: #8d2020; --fp-bg: #e1f4eb; --fp: #125c43; --wf-bg: #d4f0fe; --wf: #004ec2; --unsure-bg: #fff1da; --unsure: #754800; }
    :root[data-theme="dark"] { color-scheme: dark; --bg: #0a192f; --fg: #e6edf5; --panel: #10233f; --border: #1f3a5f; --muted: #a3b4c8; --control: #2a4a73; --hover: #173258; --accent: #0069e0; --accent-hover: #258bff; --danger: #f2a09a; --row-border: #1a3050; --th: #132a4a; --row-hover: #142b4b; --link: #a5e1ff; --subtle: #0d1f38; --target: #1d3f6e; --bug-bg: #3d1f22; --bug: #f3a5a5; --fp-bg: #173528; --fp: #8fdcb7; --wf-bg: #173258; --wf: #a5e1ff; --unsure-bg: #3a2c12; --unsure: #f0c77a; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); color: var(--fg); font: 14px/1.45 "Open Sans", -apple-system, "Segoe UI", Arial, sans-serif; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
    .bar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .controls { padding: 8px 10px; }
    .bar label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
    .path { color: var(--muted); max-width: 22ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sep { width: 1px; align-self: stretch; background: var(--border); margin: 0 4px; }
    .spacer { margin-left: auto; }
    button, input, select { font: inherit; color: inherit; }
    button, input, select { border: 1px solid var(--control); border-radius: 6px; background: var(--panel); min-height: 30px; padding: 4px 9px; }
    button { cursor: pointer; border-radius: 999px; padding: 4px 14px; }
    button:hover:enabled { background: var(--hover); }
    button:disabled, select:disabled, input:disabled { opacity: .55; cursor: default; }
    #start { color: #fff; background: var(--accent); border-color: var(--accent); }
    #start:hover:enabled { background: var(--accent-hover); }
    #stop:enabled { color: var(--danger); border-color: var(--danger); }
    #model { min-width: 180px; max-width: min(360px, 50vw); }
    #concurrency { width: 64px; }
    progress { width: 200px; accent-color: var(--accent); }
    #count, #filter button { font-variant-numeric: tabular-nums; }
    #usage { color: var(--muted); }
    #error { margin: 0; color: var(--danger); white-space: pre-wrap; overflow-wrap: anywhere; }
    #error:empty { display: none; }
    #filter { display: flex; flex-wrap: wrap; gap: 6px; margin-right: auto; }
    #filter button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .results { flex: 1; min-height: 0; overflow: auto; }
    table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 760px; }
    th, td { border-bottom: 1px solid var(--row-border); padding: 7px 10px; text-align: left; vertical-align: top; }
    th { position: sticky; top: 0; background: var(--th); white-space: nowrap; border-bottom-color: var(--border); }
    th button, .file { border: 0; border-radius: 0; padding: 0; min-height: 0; background: transparent; text-align: left; }
    th button { font-weight: 650; }
    th[aria-sort="ascending"] button::after { content: " ↑"; }
    th[aria-sort="descending"] button::after { content: " ↓"; }
    tr[data-index] { cursor: pointer; }
    tr[data-index]:hover { background: var(--row-hover); }
    td { overflow-wrap: anywhere; }
    td:nth-child(3) { width: 14%; }
    td:nth-child(4), td:nth-child(7) { width: 30%; }
    .file { color: var(--link); overflow-wrap: anywhere; }
    .file:hover { text-decoration: underline; }
    .empty, .detail { background: var(--subtle); color: var(--muted); }
    .detail pre { margin: 3px 0; overflow-x: auto; font-size: 13px; }
    .detail pre span { display: block; }
    .detail pre .target { background: var(--target); color: var(--fg); }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--subtle); white-space: nowrap; }
    .bug, .error { background: var(--bug-bg); color: var(--bug); }
    .false_positive { background: var(--fp-bg); color: var(--fp); }
    .wont_fix, .running { background: var(--wf-bg); color: var(--wf); }
    .unsure { background: var(--unsure-bg); color: var(--unsure); }
  </style>
  <script defer src="build/renderer.js"></script>
</head>
<body>
  <section class="panel controls bar" aria-label="Triage controls">
    <button id="open-report">Report…</button><span class="path" id="report-path"></span>
    <button id="open-root">Root…</button><span class="path" id="root-path"></span>
    <span class="sep"></span>
    <label>Model <select id="model" disabled><option value="">Loading models…</option></select></label>
    <label>Batches <input type="number" id="concurrency" min="1" max="16" step="1" value="4" required></label>
    <label title="Highest PVS-Studio warning level to triage">Max level <select id="max-level"><option>1</option><option selected>2</option><option>3</option></select></label>
    <button id="start" disabled>Start</button>
    <button id="stop" disabled>Stop</button>
    <button id="theme" class="spacer" aria-label="Toggle dark theme"></button>
  </section>
  <div class="bar">
    <progress id="progress" aria-label="Triage progress" max="1" value="0"></progress>
    <output id="count">0 / 0</output>
    <output id="usage"></output>
    <p id="error" role="alert"></p>
  </div>
  <div class="bar">
    <div id="filter" role="group" aria-label="Filter by verdict">
      <button data-verdict="" aria-pressed="true"></button>
      <button data-verdict="bug" class="bug" aria-pressed="false"></button>
      <button data-verdict="false_positive" class="false_positive" aria-pressed="false"></button>
      <button data-verdict="wont_fix" class="wont_fix" aria-pressed="false"></button>
      <button data-verdict="unsure" class="unsure" aria-pressed="false"></button>
      <button data-verdict="error" class="error" aria-pressed="false"></button>
    </div>
    <button data-export="csv" disabled>Export CSV</button>
    <button data-export="json" disabled>Export JSON</button>
  </div>
  <div class="panel results">
    <table aria-label="Triage results">
      <thead>
        <tr>
          <th scope="col"><button>Code</button></th>
          <th scope="col"><button>Level</button></th>
          <th scope="col"><button>File:Line</button></th>
          <th scope="col"><button>Message</button></th>
          <th scope="col"><button>Verdict</button></th>
          <th scope="col"><button>Confidence</button></th>
          <th scope="col"><button>Reason</button></th>
        </tr>
      </thead>
      <tbody><tr><td class="empty" colspan="7">Open a report to start.</td></tr></tbody>
    </table>
  </div>
</body>
</html>
